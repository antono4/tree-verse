name: C1

permissions:
  contents: write

# Menjalankan secara otomatis setiap 4 jam
on:
  schedule:
    - cron: '0 */4 * * *'  # Setiap 4 jam pada menit ke-0
  workflow_dispatch:  # Memungkinkan running manual

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with timestamp in WIB
        run: |
          export TZ="Asia/Jakarta"
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S %Z")
          echo "Last updated: $TIMESTAMP" > README.md

      - name: Configure Git
        run: |
          git config user.name "antono4"
          git config user.email "antonockr1@gmail.com"

      - name: Commit changes
        run: |
          git add README.md
          git commit -m "Auto update README at $(date +'%Y-%m-%d %H:%M:%S') WIB" || echo "No changes to commit"

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin main
